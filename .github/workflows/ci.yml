name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Build sidecar binaries
        shell: bash
        run: |
          cargo build -p focuser-cli -p focuser-native
          mkdir -p crates/focuser-ui/binaries
          host=$(rustc -vV | awk '/^host:/ {print $2}')
          ext=""
          [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          for bin in focuser-cli focuser-native; do
            cp "target/debug/$bin$ext" "crates/focuser-ui/binaries/$bin-$host$ext"
          done

      - name: Run tests
        run: cargo test --workspace --verbose

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check formatting
        run: cargo fmt --all -- --check

  build-check:
    name: Build check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Build sidecar binaries
        shell: bash
        run: |
          cargo build -p focuser-cli -p focuser-native
          mkdir -p crates/focuser-ui/binaries
          host=$(rustc -vV | awk '/^host:/ {print $2}')
          ext=""
          [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          for bin in focuser-cli focuser-native; do
            cp "target/debug/$bin$ext" "crates/focuser-ui/binaries/$bin-$host$ext"
          done

      - name: Build all crates
        run: cargo build --workspace

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/focuser-ui/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/focuser-ui/frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint and format
        run: npx biome check .

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npx vitest run

      - name: Build
        run: npx vite build

  bindings:
    name: Bindings are up to date
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      # focuser-ui declares these as Tauri sidecars, so its build script
      # refuses to run until they exist — even though exporting bindings does
      # not use them.
      - name: Build sidecar binaries
        shell: bash
        run: |
          cargo build -p focuser-cli -p focuser-native
          mkdir -p crates/focuser-ui/binaries
          host=$(rustc -vV | awk '/^host:/ {print $2}')
          for bin in focuser-cli focuser-native; do
            cp "target/debug/$bin" "crates/focuser-ui/binaries/$bin-$host"
          done

      # Generated from Rust, so a stale committed copy means the frontend is
      # typechecking against a backend that no longer exists.
      - name: Regenerate
        run: cargo run -p focuser-ui -- --export-bindings

      - name: Check for drift
        run: git diff --exit-code -- crates/focuser-ui/frontend/src/bindings.ts

  extension:
    name: Extension
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The hostname rules here mirror focuser_common::host. If they drift,
      # which form the user typed starts to matter again.
      - name: Test
        run: node --test extension/background.test.mjs

      - name: Build
        run: python extension/build.py
