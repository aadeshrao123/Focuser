name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            platform: macos-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            platform: macos-arm
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            platform: linux
            target: x86_64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/focuser-ui/frontend/package-lock.json

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # Matrix entries share a job id, so the target has to be in the key
          # or all four platforms would fight over one cache.
          key: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libasound2-dev

      - name: Build sidecar binaries (CLI, native host)
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.target }} -p focuser-cli -p focuser-native
          mkdir -p crates/focuser-ui/binaries
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/focuser-cli.exe" "crates/focuser-ui/binaries/focuser-cli-${{ matrix.target }}.exe"
            cp "target/${{ matrix.target }}/release/focuser-native.exe" "crates/focuser-ui/binaries/focuser-native-${{ matrix.target }}.exe"
          else
            cp "target/${{ matrix.target }}/release/focuser-cli" "crates/focuser-ui/binaries/focuser-cli-${{ matrix.target }}"
            cp "target/${{ matrix.target }}/release/focuser-native" "crates/focuser-ui/binaries/focuser-native-${{ matrix.target }}"
          fi
          ls -la crates/focuser-ui/binaries/

      # npx, not `cargo install tauri-cli`. The CLI ships as a prebuilt binary
      # on npm; compiling it from source was taking ten minutes on Windows,
      # longer than the build it exists to run. Not a devDependency either:
      # `beforeBuildCommand` runs `npm ci`, which wipes node_modules and would
      # delete the running binary out from under itself on Windows.
      - name: Build Tauri installer
        run: npx --yes @tauri-apps/cli@2 build --target ${{ matrix.target }}
        working-directory: crates/focuser-ui
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Collect Windows artifacts
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/bundle/nsis/*.exe dist/ 2>/dev/null || true
          cp target/${{ matrix.target }}/release/bundle/nsis/*.nsis.zip dist/ 2>/dev/null || true
          cp target/${{ matrix.target }}/release/bundle/nsis/*.nsis.zip.sig dist/ 2>/dev/null || true
          cp target/${{ matrix.target }}/release/focuser-ui.exe dist/Focuser-Portable.exe 2>/dev/null || true
          ls -la dist/

      - name: Collect macOS artifacts
        if: startsWith(matrix.platform, 'macos')
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/bundle/dmg/*.dmg dist/ 2>/dev/null || true
          # Both Macs build a Focuser.app.tar.gz. Named after the target, or
          # the release keeps whichever came last and latest.json lists neither.
          for f in target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz; do
            cp "$f" "dist/Focuser_${{ matrix.target }}.app.tar.gz"
            cp "$f.sig" "dist/Focuser_${{ matrix.target }}.app.tar.gz.sig"
          done
          ls -la dist/

      - name: Collect Linux artifacts
        if: matrix.platform == 'linux'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/bundle/deb/*.deb dist/ 2>/dev/null || true
          # Built all along for Fedora and openSUSE, and never published (#3).
          cp target/${{ matrix.target }}/release/bundle/rpm/*.rpm dist/ 2>/dev/null || true
          # The updater installs a .deb or .rpm in place, so they need theirs too (#62).
          cp target/${{ matrix.target }}/release/bundle/deb/*.deb.sig dist/ 2>/dev/null || true
          cp target/${{ matrix.target }}/release/bundle/rpm/*.rpm.sig dist/ 2>/dev/null || true
          cp target/${{ matrix.target }}/release/bundle/appimage/*.AppImage dist/ 2>/dev/null || true
          cp target/${{ matrix.target }}/release/bundle/appimage/*.AppImage.sig dist/ 2>/dev/null || true
          cp target/${{ matrix.target }}/release/bundle/appimage/*.AppImage.tar.gz dist/ 2>/dev/null || true
          cp target/${{ matrix.target }}/release/bundle/appimage/*.AppImage.tar.gz.sig dist/ 2>/dev/null || true
          cp target/${{ matrix.target }}/release/focuser-ui dist/Focuser-Linux-x86_64 2>/dev/null || true
          chmod +x dist/* 2>/dev/null || true
          ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: focuser-${{ matrix.platform }}
          path: dist/*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    # The attestation step signs with a token GitHub issues to this run and
    # stores the record with the repository. Only this job gets that.
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - uses: actions/checkout@v4

      # The release text is the tag's own message. Checkout can leave an
      # annotated tag as a plain one with no message, so fetch it again.
      - name: Write the release notes
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          node .github/scripts/release-notes.mjs "$GITHUB_REF_NAME" > notes.md
          cat notes.md

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts/ -type f | while read f; do
            cp "$f" release/
          done
          ls -la release/

      - name: Generate updater latest.json
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          REPO="aadeshrao123/Focuser"
          BASE="https://github.com/${REPO}/releases/download/${GITHUB_REF_NAME}"

          # One entry per way of installing Focuser. The updater looks for
          # `{os}-{arch}-{installer}` first and then `{os}-{arch}`, so a .deb
          # or .rpm install must find its own package. Handed the AppImage, it
          # fails with "invalid updater binary format" (#62).
          PLATFORMS=""
          add() {
            local file
            file=$(ls $2 2>/dev/null | head -1)
            if [ -z "$file" ] || [ ! -f "$file.sig" ]; then
              echo "::warning::no signed update file for $1"
              return 0
            fi
            PLATFORMS="$PLATFORMS${PLATFORMS:+,}\"$1\":{\"signature\":\"$(cat "$file.sig")\",\"url\":\"$BASE/$(basename "$file")\"}"
          }
          add windows-x86_64 'release/*.nsis.zip'
          add darwin-x86_64 'release/*x86_64-apple-darwin.app.tar.gz'
          add darwin-aarch64 'release/*aarch64-apple-darwin.app.tar.gz'
          add linux-x86_64 'release/*.AppImage.tar.gz'
          add linux-x86_64-deb 'release/*.deb'
          add linux-x86_64-rpm 'release/*.rpm'
          PLATFORMS="{$PLATFORMS}"

          cat > release/latest.json << ENDJSON
          {
            "version": "$VERSION",
            "notes": "Focuser $GITHUB_REF_NAME",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": $PLATFORMS
          }
          ENDJSON

          # Clean up indentation
          python3 -c "import json,sys; d=json.load(open('release/latest.json')); json.dump(d,open('release/latest.json','w'),indent=2)"
          echo "Generated latest.json:"
          cat release/latest.json

      # A signed public record of which run built each file from which commit
      # (#55). Anyone can check a download with:
      #   gh attestation verify <file> --repo aadeshrao123/Focuser
      - name: Attest where every file came from
        uses: actions/attest@v4
        with:
          subject-path: release/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Focuser ${{ github.ref_name }}
          body_path: notes.md
          draft: false
          prerelease: false
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
