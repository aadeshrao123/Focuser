[package]
name = "focuser-ipc"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Versioned local authority protocol and authenticated Windows named pipes"

[dependencies]
focuser-app.workspace = true
focuser-common.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
directories.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation", "Win32_UI_Shell", "Win32_System_Com", "Win32_Security", "Win32_Security_Authorization",
  "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_Services",
  "Win32_Storage_FileSystem", "Win32_System_Memory", "Win32_System_RemoteDesktop",
] }

[dev-dependencies]
tempfile = "3.27.0"
