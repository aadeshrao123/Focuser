[package]
name = "focuser-common"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared types, errors, and platform abstractions for Focuser"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
specta = { workspace = true }
specta-typescript = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
glob-match = { workspace = true }

# Application icons. Versions match what the Tauri dependency tree already
# pulls in, so neither adds a second copy to the build.
png = "0.18"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
# Pinned to the version the rest of the workspace uses.
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.55"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal"] }

[target.'cfg(target_os = "macos")'.dependencies]
icns = { version = "0.4", default-features = false }
plist = "1.8"

[target.'cfg(target_os = "linux")'.dependencies]
freedesktop-icons = "0.4"
resvg = { version = "0.47", default-features = false }

[dev-dependencies]
tempfile = "3.27.0"
