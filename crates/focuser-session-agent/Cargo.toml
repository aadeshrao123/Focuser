[package]
name = "focuser-session-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Unprivileged Focuser interactive-session observer and browser bridge"
[dependencies]
focuser-common.workspace = true
focuser-ipc.workspace = true
focuser-app.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
anyhow.workspace = true
directories.workspace = true
uuid.workspace = true
chrono.workspace = true
rodio = { version = "0.22", default-features = false, features = ["playback", "tracing", "wav", "mp3", "vorbis", "flac"] }
[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse"] }
