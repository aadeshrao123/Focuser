  placeholder: 선택…
welcome:
  headingUpdated: Focuser가 더 좋아졌습니다
  headingInstalled: Focuser를 설치해 주셔서 고맙습니다
  introUpdated: 이번 버전에서 달라진 점과, 각 부분이 어떻게 맞물리는지에 대한 짧은 안내입니다.
  introInstalled: Focuser는 일하는 동안 주의를 뺏는 사이트를 눈앞에서 치워 줍니다. 시작하는 데 필요한 내용은 여기 다 있습니다.
  setupTitle: 설정할 것은 한 가지뿐
  setupBody1: 차단 목록은 확장 프로그램이 아니라 Focuser 데스크톱 앱이 가지고 있습니다. 확장 프로그램이 앱에 물어보는 구조라서, 같은 규칙 하나로 브라우저와 프로그램을 함께 다룰 수 있습니다. 앱을 켜 두면 브라우저 쪽은 확장 프로그램이 알아서 맡습니다.
  setupBody2: 앱이 꺼져 있으면 도구 모음 아이콘에 빨간 표시가 뜨고 아무것도 차단되지 않습니다. 작동하는 척하지 않고 있는 그대로 알려 주는 것입니다.
  openApp: Focuser 앱 열기
  getApp: 데스크톱 앱 받기
  whatsNewVersion: 버전 {version}의 새로운 점
  whatsNew: 새로운 점
  new1Title: 처음부터 다시 만들었습니다
  new1Body: 확장 프로그램을 새로 작성했습니다. 더 가볍고 더 빨리 시작하며, 하나의 코드로 Chrome, Edge, Brave, Firefox를 모두 지원합니다.
  new2Title: 읽어 볼 만한 차단 화면
  new2Body: 어떤 사이트인지, 어떤 규칙에 걸렸는지 알려 주고 오늘 몇 번 시도했는지 셉니다. 그 횟수가 늘어나면 문구도 달라집니다.
  new3Title: 팝업은 사실을 말합니다
  new3Body: 사이트가 실제로 어떤 목록에 들어 있는지 보여 줍니다. 해제하면 하나를 짐작하는 대신 모든 목록에서 빼냅니다.
  new4Title: 사이트가 잠깐 보이는 일이 없습니다
  new4Body: 페이지가 그려지기 전에 차단이 적용되므로, 피하려던 것이 눈에 스칠 일이 없습니다.
  point1Title: 도메인만이 아닙니다
  point1Body: 사이트 전체, 주소에 든 단어, 패턴, 또는 사이트의 한 부분만 차단할 수 있습니다.
  point2Title: 원할 때만
  point2Body: 목록은 주간 일정에 따라 켜지게 하거나, 한 번의 집중 시간 동안만 쓸 수 있습니다.
  point3Title: 이 컴퓨터 안에서 끝납니다
  point3Body: 내 컴퓨터의 Focuser 앱하고만 통신하고, 다른 어디와도 연결하지 않습니다.
  waysTitle: 차단하는 네 가지 방법
  waysIntro: 데스크톱 앱의 웹사이트 화면에서 추가하세요. 확장 프로그램은 네 가지 모두를 적용합니다.
  colKind: 종류
  colExample: 예시
  colCovers: 적용 범위
  kindSite: 사이트
  kindWord: 단어
  kindPattern: 패턴
  kindSection: 섹션
  coversSite: 그 사이트와 그 아래 전부
  coversWord: 그 단어가 들어간 모든 주소
  coversPattern: 패턴과 일치하는 모든 것
  coversSection: 사이트의 그 부분만
  openSourceTitle: 무료이고 오픈 소스입니다
  openSourceBody1: Focuser는 전부 오픈 소스입니다. 앱과 이 확장 프로그램의 모든 코드가 GitHub에 있으니, 무슨 일을 하는지 그대로 읽어 보고 아무 데도 전송하지 않는다는 것을 직접 확인하고, 원하면 고칠 수도 있습니다.
  openSourceBody2: 거들고 싶다면 저장소로 오세요. 풀 리퀘스트는 물론 버그 신고와 아이디어도 환영합니다.
  star: 프로젝트에 별 주기
  reportBug: 버그 신고하기
  contribute: 코드 기여하기
  thanks: Focuser를 써 주셔서 고맙습니다. 하려는 일이 잘 되기를 바랍니다.
