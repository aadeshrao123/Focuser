welcome:
  headingUpdated: Focuser è appena migliorato
  headingInstalled: Grazie per aver installato Focuser
  introUpdated: Ecco cosa è cambiato in questa versione, con un breve promemoria su come si incastrano i pezzi.
  introInstalled: Focuser tiene fuori dai piedi i siti che distraggono mentre lavori. Ecco tutto il necessario per iniziare.
  setupTitle: Una cosa da sistemare
  setupBody1: L'estensione non conserva i tuoi elenchi di blocco. Li chiede all'app desktop di Focuser, ed è questo che permette a un unico insieme di regole di coprire browser e applicazioni insieme. Tieni aperta l'app e l'estensione si occupa da sola del browser.
  setupBody2: Se l'app è chiusa, l'icona nella barra mostra un segno rosso e non viene bloccato nulla. È l'estensione che è onesta con te invece di fingere di funzionare.
  openApp: Apri l'app Focuser
  getApp: Scarica l'app desktop
  whatsNewVersion: Novità della versione {version}
  whatsNew: Novità
  new1Title: Ricostruita da zero
  new1Body: L'estensione è stata riscritta. È più leggera, si avvia più in fretta, e un solo codice copre ora Chrome, Edge, Brave e Firefox.
  new2Title: Una pagina di blocco che vale la pena leggere
  new2Body: Nomina il sito, dice quale regola l'ha fermato, e conta quante volte ci hai provato oggi. Il testo cambia man mano che quel numero sale.
  new3Title: La finestra dice la verità
  new3Body: Ora mostra in quali dei tuoi elenchi si trova davvero un sito. Sbloccarlo lo toglie da tutti, invece di tirare a indovinare.
  new4Title: Nessun lampo del sito
  new4Body: Il blocco scatta prima che la pagina venga disegnata, così non intravedi mai ciò che stavi evitando.
  point1Title: Più dei domini
  point1Body: Blocca un sito intero, una parola nell'indirizzo, uno schema, oppure una sola sezione di un sito.
  point2Title: Solo quando lo vuoi tu
  point2Body: Gli elenchi possono seguire un orario settimanale o durare una singola sessione di concentrazione.
  point3Title: Resta sul tuo computer
  point3Body: Parla con l'app Focuser sul tuo computer e con nient'altro.
  waysTitle: I quattro modi per bloccare qualcosa
  waysIntro: Aggiungili nell'app desktop, alla voce Siti web. L'estensione li applica tutti e quattro.
  colKind: Tipo
  colExample: Esempio
  colCovers: Cosa copre
  kindSite: Sito
  kindWord: Parola
  kindPattern: Schema
  kindSection: Sezione
  coversSite: Il sito e tutto ciò che contiene
  coversWord: Qualsiasi indirizzo che contenga quella parola
  coversPattern: Tutto ciò che corrisponde allo schema
  coversSection: Solo quella parte di un sito
  openSourceTitle: Gratuito e open source
  openSourceBody1: Focuser è completamente open source. Ogni riga dell'app e di questa estensione è su GitHub, quindi puoi leggere esattamente cosa fa, verificare da solo che non venga inviato niente da nessuna parte, e modificarla se vuoi.
  openSourceBody2: Se vuoi dare una mano, il repository è il posto giusto. Le pull request sono benvenute, come pure le segnalazioni di bug e le idee.
