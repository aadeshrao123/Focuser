welcome:
  headingUpdated: Focuser стал лучше
  headingInstalled: Спасибо, что установили Focuser
  introUpdated: Вот что изменилось в этой версии, и короткое напоминание о том, как всё устроено.
  introInstalled: Focuser убирает отвлекающие сайты с дороги, пока вы работаете. Здесь всё, что нужно для начала.
  setupTitle: Одна вещь, которую нужно настроить
  setupBody1: Расширение не хранит ваши списки блокировки. Оно запрашивает их у приложения Focuser на компьютере, и именно это позволяет одному набору правил охватывать и браузер, и программы. Держите приложение запущенным, а расширение само позаботится о браузере.
  setupBody2: Если приложение закрыто, на значке появляется красная отметка и ничего не блокируется. Это расширение честно говорит вам об этом, вместо того чтобы делать вид, будто работает.
  openApp: Открыть приложение Focuser
  getApp: Скачать приложение
  whatsNewVersion: Что нового в версии {version}
  whatsNew: Что нового
  new1Title: Переписано с нуля
  new1Body: Расширение написано заново. Оно меньше, запускается быстрее, и один код теперь работает в Chrome, Edge, Brave и Firefox.
  new2Title: Страница блокировки, которую стоит прочитать
  new2Body: Она называет сайт, говорит, какое правило сработало, и считает, сколько раз вы пробовали сегодня. Текст меняется по мере роста этого числа.
  new3Title: Окно говорит правду
  new3Body: Теперь оно показывает, в каких именно списках находится сайт. Разблокировка убирает его из всех, а не угадывает один.
  new4Title: Сайт больше не мелькает
  new4Body: Блокировка срабатывает до отрисовки страницы, так что вы ни на миг не увидите то, чего избегали.
  point1Title: Больше, чем домены
  point1Body: Блокируйте сайт целиком, слово в адресе, шаблон или один раздел сайта.
  point2Title: Только тогда, когда вы этого хотели
  point2Body: Списки могут работать по расписанию на неделю или на время одного сеанса сосредоточения.
  point3Title: Остаётся на вашем компьютере
  point3Body: Расширение общается с приложением Focuser на вашем компьютере и больше ни с чем.
  waysTitle: Четыре способа что-то заблокировать
  waysIntro: Добавьте их в приложении, в разделе «Сайты». Расширение применяет все четыре.
  colKind: Тип
  colExample: Пример
  colCovers: Что охватывает
  kindSite: Сайт
  kindWord: Слово
  kindPattern: Шаблон
  kindSection: Раздел
  coversSite: Сайт и всё, что внутри него
  coversWord: Любой адрес, содержащий это слово
  coversPattern: Всё, что совпадает с шаблоном
  coversSection: Только эту часть сайта
  openSourceTitle: Бесплатно и с открытым кодом
  openSourceBody1: Focuser полностью открыт. Каждая строка приложения и этого расширения лежит на GitHub, так что вы можете прочитать, что именно оно делает, сами убедиться, что никуда ничего не отправляется, и изменить его, если захотите.
  openSourceBody2: Если хотите помочь, вам в репозиторий. Пул-реквесты приветствуются, сообщения об ошибках и идеи тоже.
